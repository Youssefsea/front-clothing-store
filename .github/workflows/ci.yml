name: VANTA CI

concurrency:
  group: vanta-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main", "vanta-greenfield"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run smoke
